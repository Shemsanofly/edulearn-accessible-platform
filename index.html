<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=student.html">
    <title>EduLearn - Revolutionary Accessible Educational Platform</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loading-container {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        .loading-spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
        }
        p {
            margin: 0;
            opacity: 0.9;
            font-size: 16px;
        }
        .features {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <h1>🎓 EduLearn Platform</h1>
        <p>Loading Revolutionary Accessible Educational Platform...</p>
        <div class="features">
            <p>✨ AI-Powered Sign Language Support</p>
            <p>🎤 Voice-to-Sign Converter</p>
            <p>📹 Camera Sign Recognition</p>
            <p>⠠⠃ Braille Support</p>
            <p>🌟 Inclusive Learning for All</p>
        </div>
        <p style="margin-top: 20px; font-size: 12px;">
            If you're not redirected automatically, 
            <a href="student.html" style="color: white; text-decoration: underline;">click here</a>
        </p>
    </div>

    <script>
        // Fallback redirect after 3 seconds
        setTimeout(function() {
            window.location.href = 'student.html';
        }, 3000);
    </script>
</body>
</html>
